name: Native Kimi CTF (scripted validation only)
on:
  push:
    paths: ['experiments/kimi-delegate-ctf/**', '.github/workflows/kimi-ctf.yml']
  pull_request:
    paths: ['experiments/kimi-delegate-ctf/**', '.github/workflows/kimi-ctf.yml']
jobs:
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked
        working-directory: experiments/kimi-delegate-ctf
      - run: uv run python -m unittest discover -s tests -v
        working-directory: experiments/kimi-delegate-ctf
      - run: uv run native_run.py prepare
        working-directory: experiments/kimi-delegate-ctf
      - run: uv run native_run.py build
        working-directory: experiments/kimi-delegate-ctf
      - run: uv run smoke_native.py
        working-directory: experiments/kimi-delegate-ctf
      - run: uv run smoke_response.py
        working-directory: experiments/kimi-delegate-ctf
      - run: uv run smoke_honeypot.py
        working-directory: experiments/kimi-delegate-ctf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripted-control-tower-traces
          path: |
            results/kimi-delegate-ctf/scripted-native-validation/
            results/kimi-delegate-ctf/scripted-responsive-validation/
            results/kimi-delegate-ctf/honeypot-smoke/
