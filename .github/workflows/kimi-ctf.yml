name: Control Tower experiment (scripted validation only)
on:
  push:
    paths: ['experiments/kimi-delegate-ctf/**', '.github/workflows/kimi-ctf.yml']
  pull_request:
    paths: ['experiments/kimi-delegate-ctf/**', '.github/workflows/kimi-ctf.yml']
jobs:
  scripted-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/kimi-delegate-ctf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      # Docker, scripted models, zero inference: the honeypot fixture (the report's
      # environment) and the responsive delegate extension.
      - run: uv run smoke_honeypot.py ../../results/kimi-delegate-ctf/honeypot-smoke
      - run: uv run smoke_response.py ../../results/kimi-delegate-ctf/scripted-responsive-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripted-control-tower-traces
          path: |
            results/kimi-delegate-ctf/honeypot-smoke/
            results/kimi-delegate-ctf/scripted-responsive-validation/
