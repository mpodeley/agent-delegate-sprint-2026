name: Responsive helpline
on: [push, pull_request]
jobs:
  scripted-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/kimi-delegate-ctf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run response_run.py prepare --pair fixtures/ci
      - run: uv run response_run.py build --pair fixtures/ci
      - run: uv run smoke_response.py ../../results/kimi-delegate-ctf/ci-scripted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-scripted-validation
          path: results/kimi-delegate-ctf/ci-scripted/
